name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (core + dev, no heavy research deps)
        run: uv venv && uv pip install -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Tests
        # unit tests run on synthetic data; data-dependent leakage tests skip without the dataset
        run: .venv/bin/pytest -q
