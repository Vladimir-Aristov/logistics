name: monthly-shadow

# The WIM portal publishes monthly; check for new data a few times a month.
on:
  schedule:
    - cron: "0 12 3,10,20 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Restore raw-data cache (past years never change)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Update data, rebuild, shadow-score, render dashboard
        run: .venv/bin/wim monthly
      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitoring docs
          git diff --cached --quiet || git commit -m "shadow: monitoring update $(date -u +%Y-%m-%d)"
          git push
